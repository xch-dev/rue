name: Build
on:
  push:
    branches:
      - main
    # Only version tags (like 0.12.0) trigger a release, and the package job checks that the tag
    # matches the version of the published crates.
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

  pull_request:
    branches:
      - "**"

permissions:
  contents: read

# A new push to a pull request cancels the run for the push before it
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The cargo-binstall binary's version. Keep it in step with the tag on the pinned action, since
  # Dependabot bumps only the action's commit.
  BINSTALL_VERSION: 1.27.0
  # Without debug info the workspace builds about a third faster. Panics still name the functions
  # in their backtraces, without line numbers.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_TERM_COLOR: always

# Each job's Rust cache is saved only from main, which pull requests restore from, so that the
# caches stay within the repository's limit.

jobs:
  # The tests are split into two partitions, each built and run on its own runner. Building takes
  # most of each job, and running the tests about a minute.
  test:
    name: Test (${{ matrix.partition }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Both partitions build the same thing, so they share a cache, and only the first saves it
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.partition == 1 }}

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@5885714d0a40a14b2535c6ffc051fd8e49aa9665 # v1.27.0
        with:
          version: ${{ env.BINSTALL_VERSION }}

      # Pinned to an exact version, and bumped by hand
      - name: Install cargo-nextest
        run: cargo binstall --no-confirm --locked cargo-nextest@0.9.152

      - name: Run tests
        run: >-
          cargo nextest run --all-features --workspace --profile ci
          --partition hash:${{ matrix.partition }}/2

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@5885714d0a40a14b2535c6ffc051fd8e49aa9665 # v1.27.0
        with:
          version: ${{ env.BINSTALL_VERSION }}

      # Pinned to an exact version, and bumped by hand
      - name: Install cargo-machete
        run: cargo binstall --no-confirm --locked cargo-machete@0.10.1

      - name: Fmt
        run: cargo fmt --all -- --files-with-diff --check

      - name: Clippy
        run: cargo clippy --workspace --all-features --all-targets

      - name: Unused dependencies
        run: cargo machete

      # The formatting of the .rue files is checked by the `tests` test in rue-tests

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Every published crate shares one version, and on a tag it must match the tag.
      - name: Check versions
        run: |
          versions=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '[.packages[] | select(.publish != []) | .version] | unique | join(" ")')
          if [ "$(echo "$versions" | wc -w)" -ne 1 ]; then
            echo "The published crates don't share one version: $versions"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$versions" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match the version of the published crates: $versions"
            exit 1
          fi

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Packages and builds every published crate, resolving the workspace crates locally, and fails
      # on any error, including uncommitted changes.
      - name: Publish (dry run)
        run: cargo publish --workspace --dry-run --locked

  # A short run of each fuzzer on fixed seeds, so a failure reproduces locally with the same
  # command. It fails on bugs (unsound, leaked or crashed variants, and crashes in nested-corpus),
  # not on inference giving up or a compile running past its time limit. See the doc comments in
  # `crates/rue-tests/src/bin/infer-fuzz/main.rs` and `nested-corpus.rs` for longer runs.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        run: cargo build --locked --package rue-tests --package rue-cli --bins

      # The later generator versions make larger programs, so they get fewer seeds
      - name: Inference fuzzer
        run: |
          set -eo pipefail
          for run in 1:0..1000 2:0..1000 3:0..400 4:0..400 5:0..300; do
            echo "::group::Generator ${run%%:*}, seeds ${run#*:}"
            target/debug/infer-fuzz --generator "${run%%:*}" --seeds "${run#*:}" \
              --threads "$(nproc)" --check
            echo "::endgroup::"
          done

      - name: Nested type corpus
        run: >-
          target/debug/nested-corpus --rue target/debug/rue --seeds 0..300 --threads "$(nproc)"
          --timeout 10 --check

  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@5885714d0a40a14b2535c6ffc051fd8e49aa9665 # v1.27.0
        with:
          version: ${{ env.BINSTALL_VERSION }}

      - name: Install wasm-pack
        run: cargo binstall --no-confirm --locked wasm-pack@0.15.1

      - name: Clippy (wasm32)
        run: cargo clippy --package rue-wasm --target wasm32-unknown-unknown --all-targets

      - name: Build WASM
        working-directory: wasm
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build playground
        working-directory: playground
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm build

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@5885714d0a40a14b2535c6ffc051fd8e49aa9665 # v1.27.0
        with:
          version: ${{ env.BINSTALL_VERSION }}

      # Pinned to an exact version, and bumped by hand
      - name: Install cargo-deny
        run: cargo binstall --no-confirm --locked cargo-deny@0.21.0

      # Advisories, licenses, bans and sources, as configured in deny.toml
      - name: Cargo deny
        run: cargo deny --locked check

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Overrides rust-toolchain.toml. Keep in step with `rust-version` in Cargo.toml.
      RUSTUP_TOOLCHAIN: 1.90.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check
        run: cargo check --workspace --all-features --all-targets --locked

  publish:
    if: github.ref_type == 'tag'
    needs: [test, lint, package, fuzz, wasm, deny, msrv]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Publishes the crates in dependency order, waiting for each to be available. The dry run in
      # the package job already built this commit, so this skips building it again with the token in the
      # environment. If it fails partway, rerun it locally with `--exclude` for the crates that were
      # already published.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --locked --no-verify

  # The only check that branch protection needs to require. A skipped job counts as passing, so
  # this always runs and fails explicitly if anything it depends on didn't succeed.
  required:
    name: Required checks
    if: ${{ always() }}
    needs: [test, lint, package, fuzz, wasm, deny, msrv]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more required jobs did not succeed"
          exit 1
