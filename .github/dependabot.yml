version: 2
updates:
  # Rust dependencies, in Cargo.toml and Cargo.lock. Minor and patch updates are grouped into one
  # pull request a week; major updates get their own. Dependabot counts 0.x to 0.y as minor, so the
  # Chia crates, whose 0.x bumps usually need code changes, get a group of their own.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      chia:
        patterns: ["chia*", "clvm*"]
        update-types: [minor, patch]
      cargo:
        update-types: [minor, patch]

  # Actions used by the workflows in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        update-types: [minor, patch]
