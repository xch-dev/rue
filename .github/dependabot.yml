version: 2
updates:
  # Rust dependencies, in Cargo.toml and Cargo.lock. Every update, major ones included, goes into one
  # pull request a week, so the Chia crates (clvm-traits, clvm-utils, clvmr, chialisp), whose 0.x
  # bumps Dependabot counts as major, are bumped together instead of in separate pull requests.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-deps:
        patterns: ["*"]
    ignore:
      # Must match the versions used by clvmr and clvm-traits, so these are bumped alongside them
      # rather than independently. num-bigint values are passed to and from clvmr, and the wasm
      # crate depends on getrandom only to turn on the wasm_js feature of the copy its
      # dependencies use.
      - dependency-name: num-bigint
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: getrandom
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Actions used by the workflows in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-deps:
        patterns: ["*"]
