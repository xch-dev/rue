[package]
name = "rue-lsp"
version = "0.11.0"
edition = "2024"
license = "Apache-2.0"
description = "A language server protocol (LSP) implementation for the Rue programming language."
authors = ["Brandon Haggstrom <me@rigidnetwork.com>"]
homepage = "https://github.com/xch-dev/rue"
repository = "https://github.com/xch-dev/rue"
readme = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }

[lints]
workspace = true

[dependencies]
rue-ast = { workspace = true }
rue-compiler = { workspace = true }
rue-diagnostic = { workspace = true }
rue-formatter = { workspace = true }
rue-options = { workspace = true }
rue-parser = { workspace = true }
rue-hir = { workspace = true }
rue-types = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tower-lsp = { workspace = true }
send_wrapper = { workspace = true }
rowan = { workspace = true }
indexmap = { workspace = true }

[dev-dependencies]
expect-test = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
tower = { workspace = true, features = ["util"] }
