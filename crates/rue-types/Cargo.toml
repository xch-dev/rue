[package]
name = "rue-types"
version = "0.11.0"
edition = "2024"
license = "Apache-2.0"
description = "A type system for the Rue programming language."
authors = ["Brandon Haggstrom <me@rigidnetwork.com>"]
homepage = "https://github.com/xch-dev/rue"
repository = "https://github.com/xch-dev/rue"
readme = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }

[lints]
workspace = true

[features]
# Counts the steps taken by the operations on types, for tests (see `count_steps`)
step-counter = []

[dependencies]
rue-diagnostic = { workspace = true }
id-arena = { workspace = true }
indexmap = { workspace = true }
clvmr = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
rstest = { workspace = true }
derive_more = { workspace = true, features = ["display"] }
log = { workspace = true }

[dev-dependencies]
# Enables the step counter for this crate's tests. Path-only dev-dependencies are removed when
# publishing.
rue-types = { path = ".", features = ["step-counter"] }
