[package]
name = "rue-cli"
version = "0.13.1"
edition = "2024"
rust-version = { workspace = true }
license = "Apache-2.0"
description = "A CLI tool for invoking the Rue compiler."
authors = ["Brandon Haggstrom <me@rigidnetwork.com>"]
homepage = "https://github.com/xch-dev/rue"
repository = "https://github.com/xch-dev/rue"
readme = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }

[lints]
workspace = true

[[bin]]
name = "rue"
path = "src/main.rs"

[dependencies]
rue-compiler = { workspace = true }
rue-formatter = { workspace = true }
rue-options = { workspace = true }
rue-diagnostic = { workspace = true }
rue-lir = { workspace = true }
clvmr = { workspace = true, features = ["pre-eval"] }
chialisp = { workspace = true }
clvm-utils = { workspace = true }
rue-clvm = { workspace = true }
clap = { workspace = true, features = ["derive"] }
anyhow = { workspace = true }
hex = { workspace = true }
colored = { workspace = true }
toml = { workspace = true }
glob = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
expect-test = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
