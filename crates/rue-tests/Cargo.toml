[package]
name = "rue-tests"
version = "0.13.1"
edition = "2024"
rust-version = { workspace = true }
publish = false
default-run = "rue-tests"
license = "Apache-2.0"
description = "A collection of tests for the Rue programming language."
authors = ["Brandon Haggstrom <me@rigidnetwork.com>"]
homepage = "https://github.com/xch-dev/rue"
repository = "https://github.com/xch-dev/rue"
readme = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }

[lints]
workspace = true

[dependencies]
rue-compiler = { workspace = true }
rue-ast = { workspace = true }
rue-hir = { workspace = true }
id-arena = { workspace = true }
rue-types = { workspace = true }
rowan = { workspace = true }
rue-options = { workspace = true }
rue-diagnostic = { workspace = true }
rue-lir = { workspace = true }
rue-formatter = { workspace = true }
clvmr = { workspace = true }
rue-clvm = { workspace = true }
clvm-utils = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde-saphyr = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
env_logger = { workspace = true }
indexmap = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
expect-test = { workspace = true }
