# Configuration for `cargo deny check`, which CI runs on every push and pull request.
# See https://embarkstudios.github.io/cargo-deny/checks/cfg.html

[graph]
all-features = true

[advisories]
# Advisories that don't affect what we publish. Each needs a reason, and should be removed once the
# dependency is replaced or updated.
ignore = [
    # serde_yml is unsound and unmaintained (as is libyml, which cargo-deny reports for unsoundness
    # only in direct dependencies). Only rue-tests, which isn't published, uses it, to read and write
    # snapshot files the repository controls. Replacing it is the part of #195 that's left.
    { id = "RUSTSEC-2025-0068", reason = "serde_yml is only used by the unpublished test harness" },
    # paste is unmaintained but complete, and is a build-time proc macro (used by rue-ast and clvmr).
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained, with no known vulnerability" },
    # pin-utils is unmaintained, and only reached through futures-util.
    { id = "RUSTSEC-2026-0441", reason = "pin-utils is unmaintained, with no known vulnerability" },
]

[licenses]
# Licenses of the crates we depend on. Apache-2.0 is the workspace's own license.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
exceptions = [
    # Through clvmr, which uses malachite for big integers.
    { allow = ["LGPL-3.0-only"], crate = "malachite-base" },
    { allow = ["LGPL-3.0-only"], crate = "malachite-bigint" },
    { allow = ["LGPL-3.0-only"], crate = "malachite-nz" },
]

[licenses.private]
# Unpublished workspace crates (rue-tests and rue-wasm)
ignore = true

[bans]
# Several versions of a crate are common through the Chia dependencies, and clippy's
# `multiple_crate_versions` is allowed for the same reason.
multiple-versions = "allow"
wildcards = "deny"
# Path dependencies within the workspace have no version requirement for unpublished crates.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
